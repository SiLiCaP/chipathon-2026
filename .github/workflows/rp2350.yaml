name: rp2350
on: [push, workflow_dispatch]
jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: CI emulator contract (docs/ci-emulator.md) is intact
        run: python3 rp2350/ci/check_contract.py

      - name: C harness against the software chip (selftest, fuzz)
        run: make -C rp2350/pc test

      - name: Golden ML-KEM hash jobs through the software chip
        run: make -C rp2350/pc ci-golden

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install the Arm toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build

      - name: Get pico-sdk 2.1.1
        run: |
          git clone --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Build the firmware
        run: |
          cmake -S rp2350 -B rp2350/build -G Ninja -DPICO_SDK_PATH=$HOME/pico-sdk
          cmake --build rp2350/build

      - name: Upload tt_hash_dbv3.uf2
        uses: actions/upload-artifact@v4
        with:
          name: tt_hash-firmware
          path: rp2350/build/tt_hash_dbv3.uf2
